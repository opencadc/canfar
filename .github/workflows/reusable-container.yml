name: Reusable Container Build

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: false
        default: ''
      client-payload:
        type: string
        required: true
      image-description:
        type: string
        required: true
      image-tags:
        type: string
        required: true
      image-version:
        type: string
        required: true

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: opencadc/canfar

jobs:
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      attestations: write
      id-token: write
    steps:
    - name: Harden Runner
      timeout-minutes: 10
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    -
      name: Client Payload
      timeout-minutes: 10
      env:
        CLIENT_PAYLOAD: ${{ inputs.client-payload }}
      run: |
        echo "Client Payload: ${CLIENT_PAYLOAD}"
    -
      name: Checkout Code
      timeout-minutes: 10
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout-ref }}
    -
      name: Setup Docker Buildx
      timeout-minutes: 10
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        install: true
    -
      name: Perform GHCR Login
      timeout-minutes: 10
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    -
      name: Build & Push Docker Image
      timeout-minutes: 10
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: production
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: mode=max
        sbom: true
        push: true
        labels: |
          org.opencontainers.image.title=canfar
          org.opencontainers.image.version=${{ inputs.image-version }}
          org.opencontainers.image.description='${{ inputs.image-description }}'
          org.opencontainers.image.licenses=AGPL-3.0
          org.opencontainers.image.source=https://github.com/opencadc/canfar
        tags: ${{ inputs.image-tags }}
    -
      name: Attest GHCR Container Image
      timeout-minutes: 10
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
