name: Edge Container Build

on:
  repository_dispatch:
    types: [edge-build]

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: opencadc/canfar
  IMAGE_TAG: edge

permissions:
  contents: read

jobs:
  edge-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Harden Runner
        timeout-minutes: 10
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      -
        name: Client Payload
        timeout-minutes: 10
        run: |
          echo "Client Payload: ${{ toJson(github.event.client_payload) }}"
      -
        name: Checkout Code
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Setup Docker Buildx
        timeout-minutes: 10
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          install: true
      -
        name: Perform GHCR Login
        timeout-minutes: 10
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build & Push Docker Image
        timeout-minutes: 10
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          push: true
          labels: |
            org.opencontainers.image.title=canfar
            org.opencontainers.image.version=edge
            org.opencontainers.image.description='Python Client for CANFAR Science Platform'
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.source=https://github.com/opencadc/canfar
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
      -
        name: Attest GHCR Container Image
        timeout-minutes: 10
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
