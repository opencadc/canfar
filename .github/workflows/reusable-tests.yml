name: Reusable Python Tests

on:
  workflow_call:
    inputs:
      full-suite:
        type: boolean
        required: false
        default: false
    secrets:
      CANFAR_BASEURL:
        required: false
      CANFAR_USERNAME:
        required: false
      CANFAR_PASSWORD:
        required: false
      CODECOV_TOKEN:
        required: false

permissions: read-all

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANFAR_BASEURL: ${{ secrets.CANFAR_BASEURL }}
      CANFAR_USERNAME: ${{ secrets.CANFAR_USERNAME }}
      CANFAR_PASSWORD: ${{ secrets.CANFAR_PASSWORD }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
    - name: Harden Runner
      timeout-minutes: 10
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    -
      name: Setup code repository
      timeout-minutes: 10
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    -
      name: Setup uv
      timeout-minutes: 10
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
    -
      name: Setup Python ${{ matrix.python-version }}
      timeout-minutes: 10
      run: |
        uv python install ${{ matrix.python-version }}
        uv venv --python ${{ matrix.python-version }}
        uv sync --all-extras --dev
    -
      name: Verify CANFAR credentials
      timeout-minutes: 10
      if: ${{ inputs.full-suite }}
      run: |
        set -euo pipefail
        if [ -z "${CANFAR_BASEURL}" ] || [ -z "${CANFAR_USERNAME}" ] || [ -z "${CANFAR_PASSWORD}" ]; then
          echo "CANFAR credentials are required for the full test suite" >&2
          exit 1
        fi
    -
      name: Login to CANFAR
      timeout-minutes: 10
      if: ${{ inputs.full-suite }}
      run: |
        set -euo pipefail
        uv pip install cadcutils
        printf '%s\n%s\n' "${CANFAR_USERNAME}" "${CANFAR_PASSWORD}" | uv run --no-sync canfar login cadc
        test -f "${HOME}/.ssl/cadcproxy.pem"
    -
      name: Run fast test suite
      timeout-minutes: 10
      if: ${{ !inputs.full-suite }}
      run: |
        set -euo pipefail
        uv run pytest -m "not slow" tests --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
    -
      name: Run full test suite
      timeout-minutes: 10
      if: ${{ inputs.full-suite }}
      run: |
        set -euo pipefail
        CANFAR_TEST_HOME="$HOME" uv run pytest --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
    -
      name: Remove CANFAR Certificate
      timeout-minutes: 10
      if: ${{ always() && inputs.full-suite }}
      run: |
        rm -rf ~/.ssl/
    -
      name: Upload coverage to Codecov
      timeout-minutes: 10
      if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        fail_ci_if_error: true # Fail CI if an error occurs during the upload
        token: ${{ env.CODECOV_TOKEN }}
        flags: ${{ matrix.python-version }}
        verbose: true # optional (default = false)
    -
      name: Upload test results to Codecov
      timeout-minutes: 10
      if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      with:
        token: ${{ env.CODECOV_TOKEN }}
