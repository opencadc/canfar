labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        What worked, what was confusing, or what would make your work easier?
        You do not need to decide whether it is a bug or a feature request.
        Keep credentials and private research data out of public posts.
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to tell us?
      description: A short description is enough to start.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Task or context
      description: Optional. What were you doing, and did you need a workaround?
