version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: uv
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
